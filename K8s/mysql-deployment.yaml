apiVersion: v1
kind: Namespace
metadata:
name: devops

---

apiVersion: v1
kind: Secret
metadata:
name: mysql-secret
namespace: devops
type: Opaque
data:
mysql-root-password: cm9vdA==
mysql-database: c3R1ZGVudGRi

---

apiVersion: apps/v1
kind: Deployment
metadata:
name: mysql
namespace: devops
spec:
replicas: 1
selector:
matchLabels:
app: mysql
template:
metadata:
labels:
app: mysql
spec:
containers:
- name: mysql
image: mysql:8
ports:
- containerPort: 3306
env:
- name: MYSQL_ROOT_PASSWORD
valueFrom:
secretKeyRef:
name: mysql-secret
key: mysql-root-password
- name: MYSQL_DATABASE
valueFrom:
secretKeyRef:
name: mysql-secret
key: mysql-database

---

apiVersion: v1
kind: Service
metadata:
name: mysql-service
namespace: devops
spec:
selector:
app: mysql
ports:

* port: 3306
  targetPort: 3306

---

apiVersion: apps/v1
kind: Deployment
metadata:
name: student-management
namespace: devops
spec:
replicas: 1
selector:
matchLabels:
app: student-management
template:
metadata:
labels:
app: student-management
spec:
containers:
- name: student-management
image: 3angour/student-management:latest
ports:
- containerPort: 8089
env:
- name: SPRING_DATASOURCE_URL
value: jdbc:mysql://mysql-service:3306/studentdb?createDatabaseIfNotExist=true
- name: SPRING_DATASOURCE_USERNAME
value: root
- name: SPRING_DATASOURCE_PASSWORD
value: root

---

apiVersion: v1
kind: Service
metadata:
name: student-management-service
namespace: devops
spec:
type: NodePort
selector:
app: student-management
ports:

* port: 8089
  targetPort: 8089
  nodePort: 30089
